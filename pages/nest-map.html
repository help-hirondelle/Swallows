<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swallow Trail Map & Stations | Lausanne Region</title>
    <meta
      name="description"
      content="QR-ready swallow trail with station pages and map directions to the next stage in Lausanne."
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="icon" type="image/png" href="../assets/icons/swallow-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script>
      window.SITE_BASE = "../";
      window.ACTIVE_PAGE = "trail";
      window.SITE_LANG = "en";
    </script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script src="../assets/js/site.js" defer></script>
    <script src="../assets/js/nest-map.js" defer></script>
  </head>
  <body>
    <div data-site-header></div>

    <main class="container" id="main-content">
      <section class="page-hero">
        <h1>Swallow Trail Map (Lausanne Region)</h1>
        <p>
          Scan a station QR code to jump directly to it. Select map markers to switch between Migration, Food, Finding
          Building Materials, and The Nest.
        </p>
      </section>

      <section id="trail-map" data-nest-map-root>
        <h2>Interactive Trail Stations</h2>
        <div class="nest-map-layout">
          <div class="nest-map-canvas" data-nest-map-canvas aria-label="Trail map with clickable station markers"></div>
        </div>

        <article class="trail-focus-card card" aria-live="polite">
          <h3 data-site-title>Station</h3>
          <p class="nest-map-meta"><strong>Location:</strong> <span data-site-area></span></p>
          <p class="nest-map-meta"><strong>Progress:</strong> <span data-site-status></span></p>
          <p data-site-story></p>
          <p><strong>Station link (for QR):</strong> <a data-site-note href="#"></a></p>
          <p data-next-direction></p>
          <a class="game-btn game-btn-alt" data-next-link target="_blank" rel="noopener">Open walking directions</a>
          <div class="video-embed trail-video">
            <iframe
              data-station-video
              src="https://www.youtube.com/embed/dQw4w9WgXcQ"
              title="Station video"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </article>
      </section>
    </main>

    <div data-site-footer></div>
  </body>
</html>
